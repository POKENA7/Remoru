# ローカルの hooks が消えた・無効化されたときの最終防衛線（design.md D12）。
#
# 検査の中身はここに書かない。`npm run check` を呼ぶだけにする。定義が 2 か所に
# あると必ずズレ、CI だけが赤い状態が生まれる。
#
# 秘密情報は使わない。デプロイも載せない。
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check:secrets は git の**全履歴の blob** を走査する。浅いクローンだと
          # 入力がほとんど空になり、緑のまま何も守らない検査になる（L09）
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm の既知の欠陥（npm/cli#4828）への対処。
      #
      # プラットフォーム別のネイティブバイナリを optionalDependencies で持つ
      # パッケージのうち、typescript（tsc 本体）と rolldown（vitest の中身）は
      # lockfile に **darwin-arm64 の分しかエントリが無い**。`npm ci` は lockfile に
      # あるものしか入れないので、Linux では tsc も vitest も起動しない。
      # （esbuild と biome は全プラットフォームが記録されている。パッケージ次第）
      #
      # 試して駄目だったもの:
      #   - `npm install --package-lock-only --os=linux --cpu=x64`
      #     → lockfile は 1 バイトも変わらない（npm 10.9.8 で実測）
      #   - `npm install`（`npm ci` の代わり）
      #     → lockfile の木をそのまま使うので、やはり入らない（実測）
      #   - `package.json` の optionalDependencies に足す
      #     → 直るが**本番スコープ**なので本番の依存グラフが変わる。
      #       devDependencies には置けない（macOS で EBADPLATFORM）
      #
      # 版は `npm ci` が**実際に入れた**親から取る。package.json の semver 範囲から
      # 作ると、lockfile が範囲内で上がったときに親とバイナリの版がズレる。
      #
      # **同じ形のパッケージが増えたら、ここも増える。** 見落としても静かには
      # 進まない（CI が赤くなる）ので、気づける形にはなっている。
      - name: Linux 用のネイティブバイナリを足す
        run: |
          set -eu
          ts=$(node -p "require('typescript/package.json').version")
          rd=$(node -p "require('rolldown/package.json').version")
          npm i --no-save \
            "@typescript/typescript-linux-x64@$ts" \
            "@rolldown/binding-linux-x64-gnu@$rd"

      - run: npm run check

      # 引用数の集計（D11 / タスク 8.3）。**門にはしない。**
      # trailer はコミットした瞬間に増えるので、同じコミットの中で index.json を
      # 一致させることは原理的にできない。差分を出して見えるようにするだけ
      - name: 学びの引用数を数え直して差分を見せる
        if: always()
        run: |
          npm run --silent learnings:index
          git --no-pager diff --stat .learnings/index.json || true
