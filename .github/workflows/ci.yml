# ローカルの hooks が消えた・無効化されたときの最終防衛線（design.md D12）。
#
# 検査の中身はここに書かない。`npm run check` を呼ぶだけにする。定義が 2 か所に
# あると必ずズレ、CI だけが赤い状態が生まれる。
#
# 秘密情報は使わない。デプロイも載せない。
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check:secrets は git の**全履歴の blob** を走査する。浅いクローンだと
          # 入力がほとんど空になり、緑のまま何も守らない検査になる（L09）
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # TypeScript 7 はプラットフォーム別のバイナリを optionalDependencies で持つ。
      # lockfile には**それを作った macOS の分しか**記録されず、Linux の CI では
      # `tsc` が起動しなかった（L07: 自分の環境の値だけで固めない）。
      #
      # package.json に足すと直るが、`optionalDependencies` は**本番スコープ**なので
      # 本番の依存グラフが変わる。Linux だけの問題なので CI の中だけで足す。
      # 版は `npm ci` が**実際に入れた** typescript から取る。package.json の
      # semver 範囲（`^7.0.2`）から作ると、lockfile が範囲内で上がったときに
      # 本体とバイナリの版がズレて tsc が起動しなくなる
      - name: Linux 用の tsc バイナリを足す
        run: |
          v=$(node -p "require('typescript/package.json').version")
          npm i --no-save "@typescript/typescript-linux-x64@$v"

      - run: npm run check

      # 引用数の集計（D11 / タスク 8.3）。**門にはしない。**
      # trailer はコミットした瞬間に増えるので、同じコミットの中で index.json を
      # 一致させることは原理的にできない。差分を出して見えるようにするだけ
      - name: 学びの引用数を数え直して差分を見せる
        if: always()
        run: |
          npm run --silent learnings:index
          git --no-pager diff --stat .learnings/index.json || true
