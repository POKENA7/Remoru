# ローカルの hooks が消えた・無効化されたときの最終防衛線（design.md D12）。
#
# 検査の中身はここに書かない。`npm run check` を呼ぶだけにする。定義が 2 か所に
# あると必ずズレ、CI だけが赤い状態が生まれる。
#
# 秘密情報は使わない。デプロイも載せない。
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # check:secrets は git の**全履歴の blob** を走査する。浅いクローンだと
          # 入力がほとんど空になり、緑のまま何も守らない検査になる（L09）
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` ではなく `npm install` を使う。
      #
      # npm には既知の欠陥があり（npm/cli#4828）、プラットフォーム別のネイティブ
      # バイナリを optionalDependencies で持つパッケージについて、lockfile を
      # **作った環境の分しか**エントリを記録しないものがある。このリポジトリでは
      # typescript（tsc 本体）と rolldown（vitest の中身）が darwin-arm64 だけで、
      # `npm ci` は lockfile にあるものしか入れないため、Linux の runner では
      # tsc も vitest も起動しなかった。`--os=linux --cpu=x64` を付けて lockfile を
      # 作り直しても、entry は増えなかった（npm 10.9.8 で実測）。
      #
      # 個別に `npm i --no-save` で足す形も試したが、1 つ直すと次が出る。
      # **版は lockfile に従うが、その環境に要るバイナリは解決させる**方に倒す。
      # 引き換えに `npm ci` の「lockfile と完全に一致する木」という保証は落ちる。
      # これは L07（環境依存の値を自分の環境だけで固めない）の代償である。
      - run: npm install --no-audit --no-fund

      - run: npm run check

      # 引用数の集計（D11 / タスク 8.3）。**門にはしない。**
      # trailer はコミットした瞬間に増えるので、同じコミットの中で index.json を
      # 一致させることは原理的にできない。差分を出して見えるようにするだけ
      - name: 学びの引用数を数え直して差分を見せる
        if: always()
        run: |
          npm run --silent learnings:index
          git --no-pager diff --stat .learnings/index.json || true
